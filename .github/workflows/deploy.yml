name: Build and Deploy to story.zeitblytz.media

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Include PHP backend in build output
        run: |
          cp server/track.php dist/track.php
          cp server/debug.php dist/debug.php
          cp server/anthropic.php dist/anthropic.php

      - name: Ensure deploy directories in dist
        run: |
          mkdir -p dist/data/images
          mkdir -p dist/data/projects

      - name: Preflight target path and permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            TARGET="/home/miron777/web/story.zeitblytz.media/public_html"
            mkdir -p "$TARGET"
            mkdir -p "$TARGET/data"
            mkdir -p "$TARGET/data/images"
            mkdir -p "$TARGET/data/projects"
            chmod 0777 "$TARGET" "$TARGET/data" "$TARGET/data/images" "$TARGET/data/projects" || true
            touch "$TARGET/.write_test"
            rm -f "$TARGET/.write_test"
            ls -la "$TARGET"
          script_stop: true

      - name: Deploy via native SCP with retry
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          TARGET="/home/miron777/web/story.zeitblytz.media/public_html/"
          SUCCESS=0
          for ATTEMPT in 1 2 3; do
            echo "Deploy attempt ${ATTEMPT}..."
            sshpass -p "$SSH_PASSWORD" scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -r dist/* "$SSH_USERNAME@$SSH_HOST:$TARGET" && SUCCESS=1 && break
            sleep 5
          done
          test "$SUCCESS" -eq 1

      - name: Verify deployed files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            TARGET="/home/miron777/web/story.zeitblytz.media/public_html"
            ls -la "$TARGET"
            test -f "$TARGET/index.html"
            test -f "$TARGET/track.php"
          script_stop: true
