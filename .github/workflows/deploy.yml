name: Build and Deploy to story.zeitblytz.media

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Include PHP backend in build output
        run: |
          cp server/track.php dist/track.php
          cp server/debug.php dist/debug.php
          cp server/anthropic.php dist/anthropic.php

      - name: Prepare deployment package
        run: |
          tar -czf deploy.tar.gz -C dist .
          echo "Created deployment package: $(ls -lh deploy.tar.gz)"

      - name: Upload deployment package via SSH (without SCP)
        run: |
          echo "Transferring deploy.tar.gz to server..."
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "mkdir -p ~/deploy_temp"
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null deploy.tar.gz ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/deploy_temp/deploy.tar.gz

      - name: Test write permissions and prepare server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "Checking deployment package..."
            ls -lh ~/deploy_temp/deploy.tar.gz
            
            echo "Checking target directory..."
            ls -la /home/miron777/web/story.zeitblytz.media/public_html
            
            echo "Testing write permissions..."
            touch /home/miron777/web/story.zeitblytz.media/public_html/.write_test && rm /home/miron777/web/story.zeitblytz.media/public_html/.write_test && echo "Write test successful!"
            
            echo "Backup current deployment..."
            cd /home/miron777/web/story.zeitblytz.media/public_html && rm -rf backup && mkdir backup && cp -r * backup/ 2>/dev/null || echo "Backup failed, continuing..."
            
            echo "Deploying to server..."
            cd /home/miron777/web/story.zeitblytz.media/public_html
            tar -xzf ~/deploy_temp/deploy.tar.gz
            echo "Deployment successful!"
            
            echo "Cleanup..."
            rm -rf backup
            rm -rf ~/deploy_temp
          script_stop: true
          request_pty: false
