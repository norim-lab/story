name: Build and Deploy to story.zeitblytz.media

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Include PHP backend in build output
        run: |
          cp server/track.php dist/track.php
          cp server/debug.php dist/debug.php
          cp server/anthropic.php dist/anthropic.php

      - name: Test write permissions on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "Checking target directory..."
            ls -la /home/miron777/web/story.zeitblytz.media/public_html
            echo "Testing write permissions..."
            touch /home/miron777/web/story.zeitblytz.media/public_html/.write_test && rm /home/miron777/web/story.zeitblytz.media/public_html/.write_test && echo "Write test successful!"

      - name: Deploy over SCP to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "dist/**"
          target: "/home/miron777/web/story.zeitblytz.media/public_html"
          overwrite: true
          strip_components: 1
          debug: true
